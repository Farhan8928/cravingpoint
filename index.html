<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2ECE1" />

    <title>Craving Point .88 — Dessert Atelier &amp; Grill, Trombay Mumbai</title>
    <meta
      name="description"
      content="Hand-poured chocolate, charcoal-grilled wraps and made-to-order desserts in Chembur Camp, Trombay. Open till late. Bulk and corporate gifting across Mumbai."
    />
    <link rel="canonical" href="https://cravingpoint.example/" />

    <!-- Open Graph. WhatsApp is the primary sharing surface for a Mumbai
         counter, and it reads og:image before anything else. -->
    <meta property="og:type" content="restaurant" />
    <meta property="og:title" content="Craving Point .88 — The Art of Indulgence" />
    <meta
      property="og:description"
      content="Hand-poured chocolate, charcoal-grilled wraps and made-to-order desserts in Trombay, Mumbai."
    />
    <meta property="og:image" content="/images/poster-hero.webp" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Theme, applied before first paint.

      This has to be an inline, render-blocking script in <head>. Anything later
      — the module bundle, a React effect — runs after the browser has already
      painted, so a returning visitor on dark would get a full-screen flash of
      bone paper first. Kept deliberately tiny and dependency-free; the key and
      default are mirrored in src/lib/theme.js.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('cp88-theme');
          if (t !== 'dark' && t !== 'light') t = 'light';
          document.documentElement.setAttribute('data-theme', t);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', t === 'dark' ? '#17110D' : '#F2ECE1');
        } catch (e) {
          /* blocked storage — the light default in the markup already stands */
        }
      })();
    </script>

    <!-- Fonts. Preconnect first so the DNS/TLS handshake overlaps the CSS
         request rather than queueing behind it.

         Fraunces (variable, optical-size axis) + Inter Tight. Fraunces can be
         genuinely high-contrast at display sizes while staying sturdy small —
         Playfair Display set at 14px is one of the clearest tells of a template. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter+Tight:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- The hero's first frames decide whether the opening scrub is smooth.
         Two at the mobile tier costs ~40 kB and takes the handshake off the
         critical path for every device. -->
    <link rel="preload" as="image" href="/frames/hero/w720/0001.webp" />
    <link rel="preload" as="image" href="/frames/hero/w720/0002.webp" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Craving Point .88",
        "servesCuisine": ["Desserts", "Grill", "Wraps"],
        "priceRange": "₹₹",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Chembur Camp",
          "addressLocality": "Trombay, Mumbai",
          "addressRegion": "Maharashtra",
          "postalCode": "400088",
          "addressCountry": "IN"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday"],
            "opens": "12:00",
            "closes": "23:30"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Friday", "Saturday", "Sunday"],
            "opens": "12:00",
            "closes": "01:00"
          }
        ]
      }
    </script>

    <style>
      /* Holds the correct ground colour from the very first paint, before the
         CSS bundle arrives. Both themes, so neither flashes the other. */
      html { background: #f2ece1; }
      html[data-theme='dark'] { background: #17110d; }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- Everything animates from a hidden CSS state. If the bundle never boots
         — a JS error, a blocked script, a crawler that does not run JS — that
         state would stay closed and the prerendered content would be invisible.
         This makes the failure mode "no animation" rather than "no page". -->
    <noscript>
      <style>
        .reveal-mask { clip-path: none !important; }
        .split-line > span { transform: none !important; }
        [style*="opacity: 0"], [style*="opacity:0"] { opacity: 1 !important; }
      </style>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
